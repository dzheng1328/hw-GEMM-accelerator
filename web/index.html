    <script>
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("hwgemm-theme") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f7f9fb" : "#080b10");
      })();
    </script>
